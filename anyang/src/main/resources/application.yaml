spring:
  application:
    name: anyang
  datasource:
    url: jdbc:mysql://localhost:3306/anyangproj?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: root
    password: ${PASSWORD:dongyang}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8085



  cloud:
    aws:
      s3:
        bucket: anyang-project-bucket
        region: ap-southeast-2
        access-key: ${AWS_ACCESS_KEY}
        secret-key: ${AWS_SECRET_KEY}